name: Build PoolSight APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Accept Android SDK licenses and install platform
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true
          $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager "platforms;android-34" "build-tools;34.0.0"
          echo "sdk.dir=$ANDROID_HOME" > local.properties

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.6'

      - name: Build debug APK
        run: |
          gradle assembleDebug --no-daemon > build_log.txt 2>&1 || {
            echo "=== BUILD FAILED. Extracting errors for GitHub Annotations: ==="
            grep -i -E "error:|e: |FAILURE:|What went wrong:|Caused by:" build_log.txt | head -n 15 | while IFS= read -r line; do
              echo "::error::$line"
            done
            echo "============================================================="
            exit 1
          }

      - name: Upload Build Log if Failed
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build_log.txt
          retention-days: 3

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: PoolSight-debug
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 30
